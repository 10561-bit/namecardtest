<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Identity | Namecard</title>
  <style>
    body {
      background-color: #07090e;
      color: #ffffff;
      font-family: Arial, sans-serif;
      margin: 0;
      overflow: hidden; /* 动画播放时防止页面滚动 */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    /* 1. 启动按钮层 */
    #start-overlay {
      position: fixed;
      inset: 0;
      background: #07090e;
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }
    .sound-hint {
      color: #d4af37;
      border: 1px solid #d4af37;
      padding: 10px 20px;
      border-radius: 50px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
    }

    /* 2. 电影感分镜动画层 */
    #movie-intro {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: #07090e;
      display: none; /* 默认隐藏，点击后用 JS 打开 */
    }
    .scene {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      opacity: 0;
      font-size: 1.2rem;
      letter-spacing: 2px;
      color: #d4af37;
    }
    /* 控制每一幕淡入淡出的动画公式 */
    @keyframes playScene {
      0% { opacity: 0; transform: scale(0.95); }
      20% { opacity: 1; transform: scale(1); }
      80% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.05); }
    }
    
    /* 为每一幕设置不同的出场时间 */
    .scene-1 { animation: playScene 3s ease forwards 0s; }
    .scene-2 { animation: playScene 3s ease forwards 3s; }
    .scene-3 { animation: playScene 3s ease forwards 6s; }

    /* 3. 最终的名片层 */
    #card-main {
      background: #161f30;
      border: 1px solid #d4af37;
      border-radius: 16px;
      padding: 30px;
      text-align: center;
      max-width: 350px;
      width: 90%;
      z-index: 10;
      display: none; /* 动画播完后再显示 */
      animation: fadeInCard 2s ease forwards;
    }
    @keyframes fadeInCard {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .btn {
      display: block;
      background: #d4af37;
      color: #000;
      text-decoration: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      margin-top: 20px;
    }
    img { width: 100px; height: 100px; border-radius: 50%; margin-bottom: 15px; }
  </style>
</head>
<body>

  <!-- 音频播放器 (隐藏) -->
  <audio id="bg-music" src="bgm.mp3" loop></audio>

  <!-- 第 1 阶段：点击启动界面 -->
  <div id="start-overlay">
    <h2 style="color: #fff; margin-bottom: 20px;">YOUR NAME</h2>
    <div class="sound-hint">Tap to Enter 🔊</div>
  </div>

  <!-- 第 2 阶段：电影分镜 -->
  <div id="movie-intro">
    <div class="scene scene-1">01 / INTRODUCTION<br><br><span style="color:#fff">heloooooo</span></div>
    <div class="scene scene-2">02 / weeeeeeeeeS<br><br><span style="color:#fff">Nice to meet you</span></div>
    <div class="scene scene-3">03 / blablalba<br><br><span style="color:#fff">Welcome to how r u Office</span></div>
  </div>

  <!-- 第 3 阶段：真正的名片 -->
  <div id="card-main">
    <img src="photo.jpg" alt="Profile">
    <h2 style="margin:0;">Pang Pang</h2>
    <p style="color:#94a3b8; font-size: 0.9rem;">Practice broker | Global loan and insurance</p>
    <a class="btn" href="https://wa.me/60123456789">WhatsApp Me</a>
  </div>

  <script>
    // 这里的代码负责控制点击后的流程
    document.getElementById('start-overlay').addEventListener('click', function() {
      
      // 1. 隐藏启动按钮
      this.style.display = 'none';
      
      // 2. 播放音乐
      document.getElementById('bg-music').play();
      
      // 3. 开始播放电影分镜
      document.getElementById('movie-intro').style.display = 'block';
      
      // 4. 设定一个计时器 (9000毫秒 = 9秒) 
      // 9秒后隐藏分镜，显示最终名片
      setTimeout(function() {
        document.getElementById('movie-intro').style.display = 'none';
        document.getElementById('card-main').style.display = 'block';
        document.body.style.overflow = 'auto'; // 恢复页面上下滑动
      }, 9000);
      
    });
  </script>

</body>
</html>
